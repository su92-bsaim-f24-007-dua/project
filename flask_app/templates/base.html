<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cadence Events{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <a href="{{ url_for('index') }}" class="brand">Cadence Events</a>
      <nav>
        <a href="{{ url_for('index') }}">Discover</a>
        <a href="{{ url_for('templates_catalog') }}">40 Templates</a>
        <a href="{{ url_for('scanner_console') }}">Ticket Scanner</a>
        <a href="{{ url_for('reports_overview') }}">Reports</a>
      </nav>
    </header>
    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
